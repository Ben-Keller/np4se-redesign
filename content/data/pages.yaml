  flagship:
    paragraphs:
    - The recommendations are organised around eight core objectives, mapped against four key stages of resource development, so that officials can draw out the guidance most relevant to where their country actually sits — from pre-discovery through to long-term production.
    - This edition reflects a genuinely collaborative process. It draws on the consensus insights and strategies developed over a decade of annual meetings, technical workshops, and direct country engagements, and benefited substantially from the review and input of 27 officials from NP4SE member countries and knowledge partners, whose comments and suggestions shaped its final form.
  quote: 3
  quote_photo: rig-haze
how:
  banner: /assets/img/wp/2021-01-dsc00105-e1609946208850.webp
  mission_title: Our mission
  mission: Empowering emerging producers in the Global South to secure equitable development and navigate a just energy transition through a unique, producer-led model.
  mission_text: We help our countries achieve better technical and economic outcomes from the petroleum sector, ensuring that resource development serves as a bridge to a sustainable future rather than a barrier.
  mission_images:
  - /assets/img/wp/2023-12-ghanaa-1200x800.webp
  - /assets/img/wp/2021-01-img-1076.webp
  approach_title: Our unique approach
  approach_intro: We don’t dictate policy; we facilitate the “policy labs” where national strategies are forged.
  approach:
  - label: A Trusted Space
    text: We provide an informal, commercial-free environment where governments can frankly share successes and failures without external pressure.
  - label: Balancing Trade-offs
    text: Rather than promoting one-size-fits-all solutions, we help officials weigh the risks and opportunities of different policy paths.
  - label: Country-Led Solutions
    text: We believe that peer-to-peer exchange produces practical, fit-for-purpose solutions that are far more implementable than externally-driven mandates.
  difference_title: The Producer-Led Difference
  difference_intro: 'Technical assistance is often driven by a pre-set agenda shaped by donor interests. NP4SE is bottom-up:'
  difference:
  - label: Practitioner-Driven
    text: Our topics are chosen by the officials who face these challenges daily. We are a network of practitioners, not consultants.
  - label: Shared Ownership
    text: We don’t just deliver training; we co-design it. Member countries are the owners of the process, ensuring the solutions are politically and economically viable on the ground.
  - label: A User-Owned Cooperative
    text: By shifting to a membership-dues model, we have ensured that our accountability is directly to the governments we serve.
  workstreams:
  - title: Neutral Convening
    text: A safe, non-commercial space for frank exchange.
    image: /assets/img/wp/2020-11-sid-2524-2-min-1-1-scaled.webp
    alt: Delegates around a meeting table during an annual meeting
  - title: Inter-Agency Labs
    text: Bringing Energy, Environment, and Finance ministries together to align national strategy.
    image: /assets/img/wp/2020-11-working-groups-img.webp
    alt: Officials seated in a circle under a marquee, in discussion
  - title: Peer-to-Peer Mentorship
    text: Directly pairing producers to share practitioners’ experience.
    image: /assets/img/wp/2020-11-img-4029-scaled.webp
    alt: Officials from Uganda and Guyana working together at computers during an exchange
  - title: Just-in-Time Support
    text: A technical Help Desk that responds to live regulatory and negotiation challenges.
    image: /assets/img/wp/2025-09-group-work-1-scaled.webp
    alt: Participants in group work at the licensing workshop in Takoradi, Ghana
  values:
  - title: Producer-led
    text: Officials from emerging producer countries participate in project design and delivery, which builds State capacity and increases the relevance of our programmes.
  - title: Peer-to-peer
    text: What makes this group special and unique is its peer-to-peer learning and experience sharing.
  - title: Coordinated
    text: We bring together climate policy makers, environmental regulators, petroleum policy makers and regulators, finance officials and state owned companies for joint discussions, enabling more effective policy-making and implementation.
  - title: Fit for purpose
    text: Our recommendations are focused on appropriate practice, which is fit-for-purpose, produces rapid results and makes incremental improvements to governance.
  - title: Sustainable
    text: We want our member countries to protect their environment and forge diversified, sustainable economies.
  - title: Accountable
    text: By increasing knowledge of all stakeholders, we support accountability and more realistic expectations regarding the windfalls from the sector.
  history:
  - year: '2012'
    text: Founded as the ‘New Producers Group’ by Chatham House, NRGI, and the Commonwealth Secretariat.
  - year: '2016'
    text: Launched landmark “South-South” mentorship programmes (e.g., Ghana-Tanzania).
  - year: '2022'
    text: Completed a 10-year independent evaluation confirming our unique value.
  - year: '2024'
    text: 'Established as an independent charity: New Producers for Sustainable Energy.'
