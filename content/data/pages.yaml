impact:
  banner: /assets/img/wp/2023-12-7eaee2a8-7036-40d4-9bbf-3c6314afa425.webp
  title: Impact
  stats:
  - 900+ Members across 23 countries.
  - 73% of members say our services are irreplaceable.
  - '100% Coordination breakthrough: Every participant in our alignment labs identified new ways to work across ministries.'
  - '92% Quality rating: Almost all members rate our training as “High” or “Very High” value.'
  - In 2024, NP4SE member governments began contributing membership dues. In a landscape of competing priorities and limited budgets, our member countries chosing to dedicate national resources to NP4SE is the clearest evidence of the network’s high utility and long-term relevance to national development.
  spotlights:
  - title: Guyana – Getting Ready for First Oil
    country: Guyana
    sections:
    - label: The Challenge
      text: In 2019, with "First Oil" fast approaching, Guyana faced the daunting task of regulating a world-class petroleum sector using outdated 1986 laws that did not sufficiently protect the State’s interests. The government needed to rapidly bridge gaps across capacity, institutional, and legislative frameworks before production started.
    - label: The Intervention
      text: NP4SE (as NPG) facilitated a critical inter-agency workshop, which also included existing technical assistance providers. The workshop focused on dismantling information asymmetries—such as the fact that the revenue authority lacked access to the joint operating agreements necessary for cost audits.
    - label: The Impact
      text: This session resulted in a comprehensive "Landscape Map of Immediate Actions," which clearly defined the technical, financial, and environmental tasks required of every government agency. By identifying support resources like the NPG Helpdesk and peer-to-peer exchanges with Ghana and Uganda, Guyana was able to enter its production phase with a coordinated roadmap for cost recovery, crude valuation, and environmental stewardship.
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-12-37-34-pm.webp
    photo: /assets/img/wp/2021-01-img-8669-scaled-e1609934806874-1980x1079.webp
    photo_caption: Guyana
    countries:
    - Guyana
  - title: Breaking the Policy Silos
    country: Suriname, Somalia
    sections:
    - label: The Problem
      text: Governments often operate in silos. For example, before our training & workshops on <a href="/event/aligning-national-climate-and-energy-policies-and-strategies/">Aligning Goals</a>, officials from Suriname and Somalia identified "limited coordination" and a lack of "awareness/alignment" between leading institutions as a primary barrier to a realistic national strategy.
    - label: The Outcome after our intervention
      list:
      - '100% Coordination breakthrough: Every participant surveyed reported that the course helped them identify new, specific points for inter-agency coordination within their government.'
      - Understanding of the intersection of petroleum, national development goals, and NDCs shifted from a baseline of "Some" to "High" or "Very High".
      - Participants gave a nearly perfect score when asked if the learning would directly impact their work performance, indicating a high level of practical utility.
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-12-43-26-pm.webp
    photo: /assets/img/wp/2020-11-frame-05-10-2020-11-11-06.webp
    photo_caption: ''
    countries:
    - Suriname
    - Somalia
  - title: Uganda – Turning Climate Law into Action
    country: Uganda
    sections:
    - label: The Challenge
      text: While Uganda passed the National Climate Change Act in 2021, the technical ministries lacked the specific ‘checklists’ needed to monitor and enforce emissions limits in the petroleum sector.
    - label: The Intervention
      text: Through a series of Emissions Training & Workshops (2022–2024), NP4SE brought together Energy and Environment officials to co-design regulatory tools.
    - label: The Impact
      text: The Ugandan delegation successfully developed a Monitoring, Reporting, and Verification (MRV) framework specifically for oil and gas. They are now implementing emissions monitoring checklists that allow the government to hold operators accountable to national climate goals.
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-11-32-22-am.webp
    photo: /assets/img/wp/2021-01-img-3893-scaled-e1609950508132-1980x688.webp
    photo_caption: Uganda
    countries:
    - Uganda
  - title: Suriname – Asserting its Carbon-Negative Status
    country: Suriname
    sections:
    - label: The Challenge
      text: Suriname, a carbon-negative nation, faces the complex task of developing significant offshore oil discoveries without compromising its global environmental leadership.
    - label: The Intervention
      text: In 2023 NP4SE provided a strategic White Paper and technical briefings to the Surinamese government, outlining how new producers can aim for the lowest sector emissions while investing in carbon negative projects that support national development goals.
    - label: The Impact
      text: 'At COP28, President Chan Santokhi utilized NP4SE’s research to declare a clear national mandate: <em>“Suriname will maintain its carbon negative status even when the offshore oil and gas industry is developed.”</em> This demonstrated how the network equips heads of state with the technical confidence to navigate global climate politics.'
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-12-05-28-pm.webp
    photo: /assets/img/wp/2023-11-paramaribo.webp
    photo_caption: Paramaribo, Suriname
    countries:
    - Suriname
  - title: Ghana – "Just-In-Time" Negotiation Support
    country: Ghana
    sections:
    - label: The Challenge
      text: Government regulators often face highly experienced International Oil Companies (IOCs) with far greater resources during contract negotiations.
    - label: The Intervention
      text: In November 2025, NP4SE held a specialized <a href="/event/workshop-and-training-on-licensing-strategy-and-negotiation/">Licensing Strategy and Negotiation Workshop</a> for government officials.
    - label: The Impact
      text: Participants from the regulatory agency and the national oil company reported that the training was applied immediately to a live negotiation with an IOC. By providing specific fiscal benchmarks and negotiation tactics exactly when they were needed, NP4SE helped shift the balance of power back to the state.
    - label: Feedback
      text: <em>"The course was timely and has provided me with tools to enhance my negotiating task."</em>
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-11-30-48-am.webp
    photo: /assets/img/wp/2025-09-group-work-1-scaled.webp
    photo_caption: Licensing workshop, Takoradi, 2025
    countries:
    - Ghana
  - title: The Shift to Member Ownership
    country: All member countries
    sections:
    - label: The Challenge
      text: International networks often struggle with long-term sustainability and staying relevant to the changing needs of the Global South.
    - label: The Action
      text: Recognizing the unique value of the peer-to-peer space, NP4SE members voted to contribute membership dues in 2024, leaving the contribution voluntary for countries without commercial discoveries.
    - label: The Impact
      text: This shift has created a sustainable governance model that is independent of external donor shifts. It ensures that NP4SE remains producer-led, answering only to the governments that fund and lead it. This financial commitment is a global rarity and a testament to the trust placed in the network.
    source_image: /assets/img/wp/2026-02-screenshot-2026-02-03-at-11-28-53-am.webp
    photo: /assets/img/wp/2023-09-group-photo-1980x1320.webp
    photo_caption: ''
    countries: []
  voices:
  - quote: Interacting with colleagues from other countries gave us confidence to start to “cook in the kitchen, with NPG giving advice on whether we were using too much or too little salt and pepper.” “This helped us better understand how to resolve ‘dumping mud cuttings’ near the communities, (…) become more deliberate with Environmental and Social Impact Assessments, more confident in being more strategic in dealings with the company.”
    source: Official, Turkana, Kenya, 2022 Evaluation
  - quote: Flaring gas is flaring money.
    source: Participant, 2024 Annual Meeting
  - quote: This invaluable access to knowledge and real-life experiences is such a great resource… not readily available in literature.
    source: Participant, 2025 Licensing Workshop
  - quote: Without this group, it would be like being in deep ocean water without a canoe to get to shore.
    source: Official, 2022 Evaluation
  - quote: The training helped us capitalize on discussions between all entities towards aligning on a way forward and a clearer energy strategy.
    source: Official from Lebanon
  - quote: A Net Zero sector is the way forward for the New Producers.
    source: Participant, 2024 Annual Meeting
