  intro: 'There are many ways you can support what we do: getting involved as a member, becoming a sponsor or a knowledge partner.'
  member:
    image: /assets/img/wp/2021-01-af835a9d-a733-4654-b543-ef30d5e73245-1-concentrate.webp
    countries_title: New member countries
    countries: The New Producers for Sustainable Energy welcomes new member countries. Prospective and new oil and gas producers can join as members. And established producers can join as peer countries. Continued membership is contingent on a constructive engagement and active participation in activities each year. Applications can be made by individuals representing any government agency – whether petroleum, finance, environment or planning – or a national oil company.
    individuals_title: New individual members
    individuals:
    - Membership is open to government officials and state-owned enterprises from our member and peer countries.
    - If you are not in government, but interested in supporting the Group please visit our Become a partner or Sponsor us pages. You can also access our resources and publications, which are freely available to the public.
    cost_title: Cost
    cost: Member countries at the production and development stages pay annual dues. Governments hosting a national seminar, workshop, training or Annual Meeting cover local event costs related to the venue and catering. For more tailored activities that benefit a host country, a greater share of the costs is covered by the government. NP4SE activities are free of charge, but participants cover their own travel, accommodation, and meals. A limited number of stipends are available to support these costs where needed.
