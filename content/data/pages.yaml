home:
  hero_title: New Producers for Sustainable Energy
  hero_lead: A collaborative network of governments from 22 countries helping each other navigate their new petroleum sector and achieve a just transition.
  helping:
    title: Governments helping each other
    paragraphs:
    - This group was built to be a trusted space where governments can share questions and discuss solutions that can help them manage their natural resources for the greatest national benefit. Member countries offer each other help and receive expert advice to develop and implement policies which are context-appropriate, evidence-based, and transition proof.
    - We believe that reform and change gain better acceptance if led by producer countries. Problems and solutions are defined locally. Governments learn from each other and collaborate to develop practical tools to support policy implementation.
    image: /assets/img/wp/2020-11-governments-helping-img.webp
    caption: Communications in Natural Resources Training, Lebanon, November 2018
    alt: Participants at the Communications in Natural Resources training in Lebanon, November 2018
  members:
    title: Member Countries
    paragraphs:
    - We are a network of over 1,000 government officials from 22 countries, and benefit from the participation of experts, industry and members of civil society in our discussions.
    - We welcome new member countries from emerging oil and gas provinces and value contributions from established producers.
    - Click on a country’s name to see the site’s related resources.
